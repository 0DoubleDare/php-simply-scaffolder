[package]
name = "php-generator"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = { version = "1.18.1", features = ["live-preview"] }
tokio = { version = "1.54.0", features = ["full"] }
rfd = { version = "0.17.2", features = ["xdg-portal"] }
zip = { version = "9.0.5"}
reqwest = { version = "0.13.5", features = ["rustls", "stream"] }
futures-util = { version = "0.3.34"}
bytes = "1.12.0"

tracing = { version = "0.1.44"}
tracing-subscriber = { version = "0.3.23" }

[build-dependencies]
slint-build = { version = "1.18.1" }

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.x86-64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
